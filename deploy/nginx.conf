# Origin Nginx untuk Cloudflare Tunnel.
# Hanya mendengarkan di localhost (127.0.0.1) — tidak terekspos ke internet,
# akses publik sepenuhnya lewat tunnel Cloudflare.
server {
    listen 127.0.0.1:80 default_server;
    server_name _;

    root /var/www/hari-guru;
    index index.html;

    # Static export Next.js: / -> index.html, /halaman -> halaman.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Asset Next.js di-cache permanen (versi unik per build)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
